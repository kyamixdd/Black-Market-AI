name: BlackMarket AI CI

on:
  pull_request:
    branches:
      - black-market-ai-beta
  push:
    branches:
      - black-market-ai-beta
      - implementation/complete-system-roadmap
      - implementation/persistent-runtime-settings

permissions:
  contents: read

concurrency:
  group: blackmarket-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-backend:
    name: Python backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            src_tauri/backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src_tauri/backend/requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile backend and core packages
        run: python -m compileall -q core exchange market intelligence strategies learning paper_trading database src_tauri/backend

      - name: Run Python regression suite (network-dependent exchange smoke tests excluded)
        run: python -m pytest -q -m "not live"

  desktop:
    name: Desktop TypeScript, lint, and market-data tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: blackmarket-desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: blackmarket-desktop

      - name: TypeScript and production build
        run: npm run build
        working-directory: blackmarket-desktop

      - name: Lint
        run: npm run lint
        working-directory: blackmarket-desktop

      - name: Market-data unit tests
        run: npm test
        working-directory: blackmarket-desktop

  website:
    name: Shared website frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install canonical desktop frontend dependencies
        run: npm ci
        working-directory: blackmarket-desktop

      - name: Install website dependencies
        run: npm install --no-audit --no-fund
        working-directory: blackmarket-web

      - name: TypeScript check
        run: npm run lint
        working-directory: blackmarket-web

      - name: Production website build
        run: npm run build
        working-directory: blackmarket-web
