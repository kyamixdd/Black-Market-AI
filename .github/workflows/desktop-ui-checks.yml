name: BlackMarket AI CI

on:
  pull_request:
    branches:
      - black-market-ai-beta
      - main
  push:
    branches:
      - black-market-ai-beta
      - main

permissions:
  contents: read

concurrency:
  group: blackmarket-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-backend:
    name: Python backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            src_tauri/backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src_tauri/backend/requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile backend and core packages
        run: python -m compileall -q core exchange market intelligence strategies learning paper_trading database src_tauri/backend

      - name: Run Python regression suite (network-dependent exchange smoke tests excluded)
        run: python -m pytest -q -m "not live"

  desktop:
    name: Desktop TypeScript, lint, and market-data tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: blackmarket-desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: blackmarket-desktop

      - name: TypeScript and production build
        run: npm run build
        working-directory: blackmarket-desktop

      - name: Lint
        run: npm run lint
        working-directory: blackmarket-desktop

      - name: API and market-data integration tests
        run: npm test
        working-directory: blackmarket-desktop

  website:
    name: Shared website frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install canonical desktop frontend dependencies
        run: npm ci
        working-directory: blackmarket-desktop

      - name: Install website dependencies
        run: npm install --no-audit --no-fund
        working-directory: blackmarket-web

      - name: TypeScript check
        run: npm run lint
        working-directory: blackmarket-web

      - name: Production website build
        run: npm run build
        working-directory: blackmarket-web

  windows-installer-smoke:
    name: Windows bundled backend and NSIS install smoke test
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python build toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: blackmarket-desktop/package-lock.json
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build self-contained backend and NSIS installer
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1
      - name: Install silently and verify startup without Python on PATH
        shell: pwsh
        run: |
          $installer = Get-ChildItem "blackmarket-desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $appRoot = Join-Path $env:LOCALAPPDATA "BlackMarket AI"
          $appExe = Get-ChildItem $appRoot -Filter "*.exe" -File -Recurse | Where-Object { $_.Name -notmatch "uninstall|setup" } | Select-Object -First 1
          if (-not $appExe) { throw "Installed desktop executable was not found." }
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
            $app = Start-Process -FilePath $appExe.FullName -PassThru
            $deadline = (Get-Date).AddMinutes(3)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 3
                if ($health.backend_ready -and $health.database_connected -and $health.websocket_connected) { $ready = $true; break }
              } catch {}
              if ($app.HasExited) { throw "Desktop app exited before backend became ready (exit $($app.ExitCode))." }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              Write-Host "Last health response: $($health | ConvertTo-Json -Compress -Depth 5)"
              $backendLog = Join-Path $appRoot "logs\backend.log"
              if (Test-Path $backendLog) {
                Write-Host "---- Bundled backend log (last 100 lines) ----"
                Get-Content $backendLog -Tail 100 | Write-Host
              } else {
                Write-Host "Backend log not found at $backendLog"
              }
              Write-Host "---- Backend processes ----"
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match "BlackMarketBackend|app.exe" } | Select-Object Name,ProcessId,ExecutablePath,CommandLine | Format-List | Out-String | Write-Host
              throw "Backend did not become healthy on 127.0.0.1:8765."
            }
            $null = $app.CloseMainWindow()
            if (-not $app.WaitForExit(45000)) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue; $app.WaitForExit() }
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and (Get-Process BlackMarketBackend -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds 1 }
            if (Get-Process BlackMarketBackend -ErrorAction SilentlyContinue) { throw "Backend remained running after desktop shutdown." }
          } finally { $env:PATH = $originalPath }
          $uninstaller = Get-ChildItem $appRoot -Filter "uninstall.exe" -File -Recurse | Select-Object -First 1
          if ($uninstaller) { Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait }
          if (Get-Process BlackMarketBackend -ErrorAction SilentlyContinue) { throw "Backend remained running after uninstall." }
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackmarket-ai-windows-nsis
          path: blackmarket-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
