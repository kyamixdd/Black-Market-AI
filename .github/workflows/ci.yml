name: CI

on:
  push:
    branches:
      - main
      - "audit/**"
      - "integration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run test suite
        env:
          APP_ENV: test
          TELEGRAM_ENABLED: "false"
          REAL_TRADING_ENABLED: "false"
        run: pytest -q

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackmarket-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blackmarket-desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
