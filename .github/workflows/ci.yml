name: CI

on:
  push:
    branches:
      - main
      - "audit/**"
      - "integration/**"
      - "web/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src_tauri/backend/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run test suite
        env:
          APP_ENV: test
          TELEGRAM_ENABLED: "false"
          REAL_TRADING_ENABLED: "false"
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackmarket-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blackmarket-desktop/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build


  tauri-rust:
    name: Tauri backend supervisor Rust check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackmarket-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Compile supervisor
        run: cargo check --locked

  web:
    name: Web dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackmarket-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Build web dashboard
        env:
          BLACKMARKET_BACKEND_URL: https://backend.invalid
          BLACKMARKET_API_TOKEN: ci-placeholder-token
          BLACKMARKET_WEB_PASSWORD: ci-placeholder-password
          BLACKMARKET_SESSION_SECRET: ci-placeholder-session-secret-at-least-32-characters
        run: npm run build
