name: Hosted deployment smoke test

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: HTTPS URL of the deployed FastAPI backend (no trailing slash)
        required: true
        type: string
      frontend_url:
        description: Optional HTTPS URL of the deployed Next.js frontend
        required: false
        type: string

permissions:
  contents: read

jobs:
  hosted-smoke:
    name: Verify hosted backend and frontend connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BLACKMARKET_BACKEND_URL: ${{ inputs.backend_url }}
      BLACKMARKET_FRONTEND_URL: ${{ inputs.frontend_url }}
      BLACKMARKET_API_TOKEN: ${{ secrets.BLACKMARKET_API_TOKEN }}
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BLACKMARKET_API_TOKEN" || ${#BLACKMARKET_API_TOKEN} -lt 32 ]]; then
            echo "BLACKMARKET_API_TOKEN repository secret is missing or too short." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          for key in ("BLACKMARKET_BACKEND_URL", "BLACKMARKET_FRONTEND_URL"):
              value = os.environ.get(key, "").strip()
              if not value and key.endswith("FRONTEND_URL"):
                  continue
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit(f"{key} must be an HTTPS URL without credentials, query, or fragment")
          PY
      - name: Verify backend readiness and database
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 15 "$BLACKMARKET_BACKEND_URL/health")"
          HEALTH_JSON="$health" python - <<'PY'
          import json, os
          h = json.loads(os.environ["HEALTH_JSON"])
          required = ("backend_ready", "database_connected", "websocket_connected")
          failed = [key for key in required if h.get(key) is not True]
          if failed:
              raise SystemExit("Backend health failed: " + ", ".join(failed))
          print("Backend health verified; version:", h.get("version"))
          PY
      - name: Verify API authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          unauth="$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" "$BLACKMARKET_BACKEND_URL/api/system/status")"
          if [[ "$unauth" != "401" ]]; then
            echo "Expected unauthenticated API request to return 401; got $unauth" >&2
            exit 1
          fi
          auth="$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $BLACKMARKET_API_TOKEN" "$BLACKMARKET_BACKEND_URL/api/system/status")"
          if [[ "$auth" != "200" ]]; then
            echo "Authenticated read-only API request failed with HTTP $auth" >&2
            exit 1
          fi
      - name: Verify SSE endpoint
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          set +e
          curl --silent --show-error --max-time 5 -D "$headers" -o "$body" -H "Authorization: Bearer $BLACKMARKET_API_TOKEN" "$BLACKMARKET_BACKEND_URL/api/events/stream"
          result=$?
          set -e
          # curl timeout is expected for an open-ended stream after headers/data arrive.
          if [[ "$result" != "0" && "$result" != "28" ]]; then
            echo "SSE request failed with curl exit $result" >&2
            exit 1
          fi
          grep -qi "^HTTP/.* 200" "$headers"
          grep -qi "^content-type: text/event-stream" "$headers"
          grep -q "retry: 3000" "$body"
          rm -f "$headers" "$body"
      - name: Verify hosted frontend and backend proxy health
        if: ${{ inputs.frontend_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$BLACKMARKET_FRONTEND_URL/" -o /dev/null
          health="$(curl --fail --silent --show-error --max-time 15 "$BLACKMARKET_FRONTEND_URL/api/health")"
          HEALTH_JSON="$health" python - <<'PY'
          import json, os
          h = json.loads(os.environ["HEALTH_JSON"])
          if h.get("status") != "ok" or h.get("backend_ready") is not True or h.get("database_connected") is not True:
              raise SystemExit("Frontend server-side backend health proxy is not ready")
          print("Frontend and backend proxy connectivity verified.")
          PY
