name: Desktop tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build, install-test, and draft Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python build toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: blackmarket-desktop/package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify release tag and version metadata
        shell: pwsh
        run: |
          python scripts/verify_release_version.py
          $config = Get-Content "blackmarket-desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match product version $expectedTag."
          }

      - name: Build self-contained backend and NSIS installer
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1

      - name: Clean install and bundled backend startup smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem "blackmarket-desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $appRoot = Join-Path $env:LOCALAPPDATA "BlackMarket AI"
          $appExe = Get-ChildItem $appRoot -Filter "*.exe" -File -Recurse | Where-Object { $_.Name -notmatch "uninstall|setup" } | Select-Object -First 1
          if (-not $appExe) { throw "Installed desktop executable was not found." }
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
            $app = Start-Process -FilePath $appExe.FullName -PassThru
            $deadline = (Get-Date).AddMinutes(3)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 3
                if ($health.backend_ready -and $health.database_connected -and $health.websocket_connected) { $ready = $true; break }
              } catch {}
              if ($app.HasExited) { throw "Desktop app exited before backend became ready (exit $($app.ExitCode))." }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw "Bundled backend did not become ready." }
            $null = $app.CloseMainWindow()
            if (-not $app.WaitForExit(45000)) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue; $app.WaitForExit() }
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and (Get-Process BlackMarketBackend -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds 1 }
            if (Get-Process BlackMarketBackend -ErrorAction SilentlyContinue) { throw "Backend remained running after desktop shutdown." }
          } finally { $env:PATH = $originalPath }
          $uninstaller = Get-ChildItem $appRoot -Filter "uninstall.exe" -File -Recurse | Select-Object -First 1
          if (-not $uninstaller) { throw "Installer did not register an uninstaller." }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
          if (Get-Process BlackMarketBackend -ErrorAction SilentlyContinue) { throw "Backend remained running after uninstall." }

      - name: Generate installer checksum and provenance manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem "blackmarket-desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          ./scripts/write_release_manifest.ps1 -InstallerPath $installer.FullName -OutputDirectory "release-output"

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackmarket-ai-${{ github.ref_name }}-windows
          path: |
            blackmarket-desktop/src-tauri/target/release/bundle/nsis/*.exe
            release-output/release-manifest.json
            release-output/installer.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release with the tested installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "blackmarket-desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $config = Get-Content "blackmarket-desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          gh release create "$env:GITHUB_REF_NAME" "$($installer.FullName)" "release-output/installer.sha256" "release-output/release-manifest.json" --draft --verify-tag --title "BlackMarket AI $($config.version) Beta" --notes-file RELEASE_NOTES.md
